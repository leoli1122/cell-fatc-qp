<style>
  :root{
    --bg:#ffffff;
    --bg-2:#f7f8fa;
    --bg-3:#eef1f6;
    --line:#e3e7ee;
    --line-2:#c9d0db;
    --ink:#1a1f2c;
    --ink-2:#4a5365;
    --ink-3:#7a8294;
    --accent:#0a8d4d;
    --accent-soft:#e6f5ed;
    --accent-2:#0a6cb8;
    --accent-2-soft:#e3f0fb;
    --warn:#b85a00;
    --warn-soft:#fbeede;
    --crit:#c93636;
    --crit-soft:#fbe5e5;
    --star:#a07000;
    --star-soft:#fbf2d8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:'Manrope','Noto Sans TC',system-ui,sans-serif;
    font-size:15px;line-height:1.5;letter-spacing:.01em;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  a{color:inherit}
  .mono{font-family:'JetBrains Mono',monospace;font-feature-settings:"tnum" 1}

  /* ── HEADER ──────────────────────────────────── */
  header{
    position:sticky;top:0;z-index:50;
    background:rgba(255,255,255,.92);
    backdrop-filter:saturate(140%) blur(10px);
    -webkit-backdrop-filter:saturate(140%) blur(10px);
    border-bottom:1px solid var(--line);
  }
  .nav{
    max-width:1280px;margin:0 auto;padding:14px 18px;
    display:flex;align-items:center;gap:14px;
  }
  .brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .brand-mark{
    width:34px;height:34px;border-radius:8px;
    background:linear-gradient(135deg,var(--accent) 0%,var(--accent-2) 100%);
    display:grid;place-items:center;color:#fff;
    font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;
    box-shadow:0 4px 12px rgba(10,141,77,.22);
  }
  .brand-text{display:flex;flex-direction:column;line-height:1.1}
  .brand-text strong{font-size:14px;letter-spacing:.02em;color:var(--ink)}
  .brand-text small{font-size:11px;color:var(--ink-3);font-family:'JetBrains Mono',monospace;margin-top:2px}

  /* ── PRODUCT TABS ────────────────────────────── */
  .product-tabs{
    max-width:1280px;margin:0 auto;
    padding:0 18px;
    display:flex;gap:4px;
    border-bottom:1px solid var(--line);
    overflow-x:auto;
    scrollbar-width:none;
  }
  .product-tabs::-webkit-scrollbar{display:none}
  .product-tab{
    flex-shrink:0;
    background:transparent;border:0;color:var(--ink-3);
    padding:11px 14px 13px;
    font-family:inherit;font-size:14px;font-weight:500;
    cursor:pointer;
    border-bottom:2px solid transparent;
    margin-bottom:-1px;
    transition:color .15s, border-color .15s;
    display:inline-flex;align-items:center;gap:7px;
  }
  .product-tab:hover{color:var(--ink-2)}
  .product-tab.active{
    color:var(--accent);
    border-bottom-color:var(--accent);
    font-weight:600;
  }
  .product-tab .tab-count{
    font-family:'JetBrains Mono',monospace;font-size:11px;
    background:var(--bg-2);
    color:var(--ink-3);
    padding:2px 7px;border-radius:99px;
    border:1px solid var(--line);
  }
  .product-tab.active .tab-count{
    background:var(--accent-soft);color:var(--accent);
    border-color:rgba(10,141,77,.2);
  }
  .product-tab.disabled{
    color:var(--ink-3);opacity:.55;
  }
  .product-tab.disabled .tab-count{
    background:var(--bg-2);color:var(--ink-3);
  }

  /* ── INNER VIEW TABS (管制項目 / 附件) ──────── */
  .view-tabs{
    max-width:1280px;margin:0 auto;
    padding:12px 18px 0;
    display:flex;gap:6px;
  }
  .view-tab{
    background:var(--bg-2);
    border:1px solid var(--line);
    color:var(--ink-2);
    padding:7px 14px;
    border-radius:8px;
    font-family:inherit;font-size:13.5px;font-weight:500;
    cursor:pointer;
    transition:all .15s;
    display:inline-flex;align-items:center;gap:7px;
  }
  .view-tab:hover{color:var(--ink);border-color:var(--line-2)}
  .view-tab.active{
    background:var(--ink);
    color:#fff;
    border-color:var(--ink);
  }
  .view-tab .tab-count{
    font-family:'JetBrains Mono',monospace;font-size:11px;opacity:.7;
  }

  /* ── SEARCH ──────────────────────────────────── */
  .search-wrap{max-width:1280px;margin:0 auto;padding:10px 18px 12px}
  .search{
    position:relative;display:flex;align-items:center;gap:10px;
    background:var(--bg-2);
    border:1px solid var(--line);
    border-radius:14px;padding:10px 12px;
    transition:border-color .15s, box-shadow .15s, background .15s;
  }
  .search:focus-within{
    border-color:var(--accent);
    background:#fff;
    box-shadow:0 0 0 3px rgba(10,141,77,.12);
  }
  .search svg{flex-shrink:0;color:var(--ink-2)}
  .search input{
    flex:1;background:transparent;border:0;outline:0;
    color:var(--ink);font-family:inherit;font-size:16px;min-width:0;
  }
  .search input::placeholder{color:var(--ink-3)}
  .search .clear{
    border:0;background:var(--bg-3);color:var(--ink-2);
    width:28px;height:28px;border-radius:8px;cursor:pointer;
    display:none;align-items:center;justify-content:center;
  }
  .search .clear:hover{background:var(--line);color:var(--ink)}
  .search.has-value .clear{display:flex}
  .search .kbd{
    display:none;font-family:'JetBrains Mono',monospace;font-size:11px;
    color:var(--ink-3);padding:3px 7px;border:1px solid var(--line);
    border-radius:6px;background:#fff;
  }
  @media(min-width:720px){.search .kbd{display:inline-block}}

  /* ── FILTER CHIPS ────────────────────────────── */
  .chips{
    display:flex;gap:8px;overflow-x:auto;
    padding:0 18px 12px;max-width:1280px;margin:0 auto;
    scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex-shrink:0;border:1px solid var(--line);background:#fff;color:var(--ink-2);
    padding:7px 12px;border-radius:99px;
    font-size:13px;cursor:pointer;transition:all .15s;
    font-family:inherit;display:inline-flex;align-items:center;gap:6px;
  }
  .chip:hover{color:var(--ink);border-color:var(--line-2)}
  .chip.active{
    background:var(--accent);color:#fff;border-color:var(--accent);
    font-weight:600;
  }
  .chip .count{font-family:'JetBrains Mono',monospace;font-size:11px;opacity:.65}
  .chip.active .count{opacity:.85}

  /* ── MAIN ────────────────────────────────────── */
  main{max-width:1280px;margin:0 auto;padding:6px 18px 100px}

  .summary{
    display:flex;justify-content:space-between;align-items:baseline;
    margin:6px 2px 14px;
    font-size:13px;color:var(--ink-3);
    font-family:'JetBrains Mono',monospace;
  }
  .summary strong{color:var(--ink);font-weight:600}

  /* ── CARD (records) ──────────────────────────── */
  .card{
    background:#fff;border:1px solid var(--line);border-radius:14px;
    margin-bottom:10px;overflow:hidden;
    transition:border-color .15s, box-shadow .15s;
  }
  .card:hover{border-color:var(--line-2);box-shadow:0 2px 8px rgba(15,30,60,.04)}
  .card-head{
    display:flex;align-items:flex-start;gap:12px;
    padding:14px 16px;cursor:pointer;user-select:none;position:relative;
  }
  .card-head::after{
    content:'';position:absolute;right:18px;top:50%;
    width:8px;height:8px;border-right:1.5px solid var(--ink-3);
    border-bottom:1.5px solid var(--ink-3);
    transform:translateY(-65%) rotate(45deg);
    transition:transform .2s;
  }
  .card.open .card-head::after{transform:translateY(-25%) rotate(-135deg)}

  .stage-tag{
    flex-shrink:0;font-family:'JetBrains Mono',monospace;
    font-size:10px;font-weight:700;letter-spacing:.04em;
    padding:4px 7px;border-radius:5px;
    background:var(--bg-2);color:var(--ink-2);
    border:1px solid var(--line);
  }
  .stage-tag.s1{background:var(--accent-soft);color:var(--accent);border-color:rgba(10,141,77,.2)}
  .stage-tag.s2{background:var(--accent-2-soft);color:var(--accent-2);border-color:rgba(10,108,184,.2)}
  .stage-tag.s3{background:var(--warn-soft);color:var(--warn);border-color:rgba(184,90,0,.2)}

  .card-title{flex:1;min-width:0;padding-right:24px}
  .card-title h3{margin:0 0 3px;font-size:15px;font-weight:600;color:var(--ink);line-height:1.35}
  .card-meta{
    font-size:12px;color:var(--ink-3);
    font-family:'JetBrains Mono',monospace;
    display:flex;flex-wrap:wrap;gap:0 12px;
  }
  .card-meta .proc{color:var(--ink-2)}

  .spec-pill{
    flex-shrink:0;align-self:flex-start;margin-top:1px;
    font-family:'JetBrains Mono',monospace;font-size:11px;
    color:var(--ink);background:var(--bg-2);
    border:1px solid var(--line);
    padding:5px 9px;border-radius:6px;
    max-width:46%;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  @media(max-width:560px){.spec-pill{display:none}}

  .card-body{display:none;padding:0 16px 14px;border-top:1px solid var(--line)}
  .card.open .card-body{display:block}

  .field{padding:11px 0;border-bottom:1px dashed var(--line)}
  .field:last-child{border-bottom:0}
  .field-label{
    font-size:11px;color:var(--ink-3);
    text-transform:uppercase;letter-spacing:.08em;
    font-family:'JetBrains Mono',monospace;
    margin-bottom:4px;
  }
  .field-value{
    color:var(--ink);font-size:14px;
    white-space:pre-wrap;word-break:break-word;
  }
  .field-value.spec{
    font-family:'JetBrains Mono',monospace;font-size:13.5px;
    background:var(--bg-2);border:1px solid var(--line);
    padding:8px 10px;border-radius:8px;
    line-height:1.55;
  }
  .field-value.action{color:var(--ink);font-size:13.5px;line-height:1.55}

  .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .badge{
    font-family:'JetBrains Mono',monospace;font-size:11px;
    padding:3px 8px;border-radius:99px;
    border:1px solid var(--line);background:var(--bg-2);color:var(--ink-2);
  }
  .badge.special{color:var(--star);border-color:rgba(160,112,0,.3);background:var(--star-soft)}
  .badge.special::before{content:'☆ '}
  .badge.critical{color:var(--crit);border-color:rgba(201,54,54,.3);background:var(--crit-soft)}
  .badge.critical::before{content:'★ '}

  mark{background:#fff3a3;color:#5a4500;border-radius:3px;padding:0 2px;font-weight:600}

  /* ── APPENDIX CARD ───────────────────────────── */
  .ap-card{
    background:#fff;border:1px solid var(--line);border-radius:14px;
    margin-bottom:14px;
    overflow:hidden;
  }
  .ap-head{
    display:flex;align-items:center;gap:10px;
    padding:14px 16px;
    background:var(--bg-2);
    border-bottom:1px solid var(--line);
  }
  .ap-code{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;font-weight:700;letter-spacing:.04em;
    background:#fff;
    padding:4px 8px;border-radius:5px;
    border:1px solid var(--line);
    color:var(--ink-2);
    flex-shrink:0;
  }
  .ap-title{font-size:14.5px;font-weight:600;color:var(--ink);line-height:1.4}
  .ap-body{padding:14px 16px}

  .ap-sub{
    font-size:13px;font-weight:600;color:var(--ink);
    margin:14px 0 8px;
    padding-left:8px;
    border-left:3px solid var(--accent);
  }
  .ap-body > .ap-sub:first-child{margin-top:2px}

  .ap-list{
    margin:0 0 6px;padding:0 0 0 18px;
    font-size:13.5px;color:var(--ink-2);line-height:1.65;
  }
  .ap-list li{margin-bottom:3px}

  .ap-paragraph{
    font-size:13.5px;color:var(--ink-2);line-height:1.65;
    margin:6px 0 10px;
  }

  .ap-note{
    font-size:12.5px;color:var(--ink-2);
    background:var(--star-soft);
    border:1px solid rgba(160,112,0,.2);
    padding:8px 12px;border-radius:8px;
    margin:6px 0 10px;
    line-height:1.55;
  }
  .ap-note::before{content:'註：';color:var(--star);font-weight:600}

  .ap-table-wrap{
    overflow-x:auto;
    border:1px solid var(--line);
    border-radius:8px;
    margin:6px 0 10px;
    -webkit-overflow-scrolling:touch;
  }
  .ap-table{
    width:100%;border-collapse:collapse;
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    min-width:500px;
  }
  .ap-table th, .ap-table td{
    padding:8px 10px;
    border-bottom:1px solid var(--line);
    border-right:1px solid var(--line);
    text-align:left;
    white-space:nowrap;
    color:var(--ink);
  }
  .ap-table th{
    background:var(--bg-2);
    font-weight:600;
    color:var(--ink-2);
    position:sticky;top:0;
  }
  .ap-table tr:last-child td{border-bottom:0}
  .ap-table th:last-child, .ap-table td:last-child{border-right:0}
  .ap-table td:first-child{
    font-weight:600;color:var(--ink-2);
    background:var(--bg-2);
  }

  /* ── TIPS ────────────────────────────────────── */
  .tips{
    margin:0 0 16px;padding:11px 14px;
    background:var(--bg-2);border:1px solid var(--line);
    border-left:3px solid var(--accent);
    border-radius:10px;
    font-size:12.5px;color:var(--ink-2);
    display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  }
  .tips strong{color:var(--ink);font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.05em}
  .tips code{
    font-family:'JetBrains Mono',monospace;
    background:#fff;padding:3px 8px;border-radius:5px;
    border:1px solid var(--line);font-size:11.5px;color:var(--ink);cursor:pointer;
    transition:all .15s;
  }
  .tips code:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

  /* ── EMPTY ───────────────────────────────────── */
  .empty{text-align:center;padding:60px 20px;color:var(--ink-3)}
  .empty .big{font-size:42px;margin-bottom:8px;opacity:.4}
  .empty h4{margin:0 0 4px;color:var(--ink-2);font-weight:500;font-size:15px}
  .empty p{margin:0;font-size:13px;font-family:'JetBrains Mono',monospace}

  /* ── PRODUCT EMPTY (尚未上傳) ──────────────── */
  .product-empty{
    text-align:center;padding:80px 20px;color:var(--ink-3);
  }
  .product-empty .big{font-size:48px;margin-bottom:10px;opacity:.35}
  .product-empty h3{margin:0 0 6px;color:var(--ink-2);font-weight:500;font-size:16px}
  .product-empty p{margin:0;font-size:13px;font-family:'JetBrains Mono',monospace}

  footer{
    text-align:center;padding:24px 18px 40px;
    color:var(--ink-3);font-size:11.5px;
    font-family:'JetBrains Mono',monospace;
  }
  footer .sep{margin:0 8px;opacity:.4}

  @media(max-width:560px){
    .nav{padding:12px 14px;gap:10px}
    .brand-text strong{font-size:13px}
    .product-tabs{padding:0 14px}
    .product-tab{padding:11px 11px 13px;font-size:13.5px}
    .view-tabs{padding:10px 14px 0}
    .search-wrap{padding:8px 14px 10px}
    .chips{padding:0 14px 10px}
    main{padding:4px 14px 100px}
    .card-head{padding:13px 14px}
    .card-body{padding:0 14px 12px}
    .card-title h3{font-size:14.5px}
    .ap-head{padding:12px 14px}
    .ap-body{padding:12px 14px}
    .ap-table{font-size:12px}
    .ap-table th, .ap-table td{padding:7px 9px}
  }

  /* ── PWA / 安全區域適配 ────────────────────────────── */
  body {
    padding-bottom: env(safe-area-inset-bottom);
  }
  header {
    padding-top: env(safe-area-inset-top);
  }

  /* ── 安裝提示橫幅 ──────────────────────────────────── */
  #pwa-banner {
    display: none;
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 999;
    background: var(--accent); color: #fff;
    padding: 14px 18px calc(14px + env(safe-area-inset-bottom));
    flex-direction: column; gap: 10px;
    box-shadow: 0 -4px 20px rgba(0,0,0,.15);
    animation: slideUp .3s ease;
  }
  #pwa-banner.show { display: flex; }
  #pwa-banner-row1 { display: flex; align-items: center; gap: 12px; }
  #pwa-banner-icon {
    width: 42px; height: 42px; border-radius: 10px;
    background: rgba(255,255,255,.2); display: grid; place-items: center;
    font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 16px;
    flex-shrink: 0;
  }
  #pwa-banner-text { flex: 1; }
  #pwa-banner-text strong { font-size: 14px; display: block; }
  #pwa-banner-text span { font-size: 12px; opacity: .85; }
  #pwa-banner-close {
    background: none; border: none; color: #fff; opacity: .8;
    padding: 4px; cursor: pointer; flex-shrink: 0; font-size: 20px; line-height: 1;
  }
  #pwa-banner-row2 { display: flex; gap: 10px; }
  #pwa-install-btn, #pwa-ios-btn {
    flex: 1; padding: 10px; border-radius: 8px; border: none; cursor: pointer;
    font-size: 14px; font-weight: 600; font-family: inherit;
    background: rgba(255,255,255,.25); color: #fff;
    transition: background .15s;
  }
  #pwa-install-btn:active, #pwa-ios-btn:active { background: rgba(255,255,255,.4); }
  #pwa-ios-guide {
    display: none;
    background: rgba(0,0,0,.15); border-radius: 8px;
    padding: 10px 12px; font-size: 12.5px; line-height: 1.7;
  }
  #pwa-ios-guide.show { display: block; }

  @keyframes slideUp {
    from { transform: translateY(100%); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }

  /* ── 離線提示 ──────────────────────────────────────── */
  #offline-toast {
    display: none;
    position: fixed; top: 60px; left: 50%; transform: translateX(-50%);

<script>
// ============================================================
// 台塑電芯管制計畫查詢平台 · 主程式
// ============================================================
(function(){
  'use strict';

  const PRODUCTS = window.PRODUCTS || {};
  const $ = sel => document.querySelector(sel);
  const $$ = sel => Array.from(document.querySelectorAll(sel));

  // ─── State ─────────────────────────
  const state = {
    productId: null,   // 當前產品
    view: 'records',   // 'records' | 'appendices'
    query: '',
    apQuery: '',
    stage: 'all',
    apStage: 'all',
    special: null,
    expanded: new Set(),
  };

  // ─── DOM ──────────────────────────
  const elProductTabs = $('#product-tabs');
  const elViewTabs = $('#view-tabs');
  const elBrandVer = $('#brand-version');
  const elFooterDoc = $('#footer-doc');

  const elRecordsControls = $('#records-controls');
  const elApControls = $('#ap-controls');
  const elRecordsView = $('#records-view');
  const elApView = $('#appendices-view');
  const elProductEmptyView = $('#product-empty-view');

  const elInput = $('#q');
  const elClear = $('#clear');
  const elBox = $('#search-box');
  const elList = $('#list');
  const elEmpty = $('#empty');
  const elHit = $('#hit-count');
  const elActive = $('#active-filter');
  const elChips = $('#chips');
  const elTips = $('#tips-box');

  const elApInput = $('#ap-q');
  const elApClear = $('#ap-clear');
  const elApBox = $('#ap-search-box');
  const elApList = $('#ap-list');
  const elApEmpty = $('#ap-empty');
  const elApHit = $('#ap-hit-count');
  const elApActive = $('#ap-active-filter');
  const elApChips = $('#ap-chips');

  // ─── Util ──────────────────────────
  function escapeHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g, c=>({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    })[c]);
  }
  function hl(text, q){
    if(!q || !text) return escapeHtml(text||'');
    const t = String(text);
    const safeQ = q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    return escapeHtml(t).replace(new RegExp(safeQ,'gi'), m=>`<mark>${m}</mark>`);
  }
  const stageClass = s => s==='一工段'?'s1':s==='二工段'?'s2':s==='三工段'?'s3':'';

  function searchableText(r){
    return [r.stage,r.process,r.procName,r.equipment,r.item,r.spec,r.measure,r.sample,r.control,r.action,r.owner]
      .filter(Boolean).join(' ');
  }
  function searchableAppendix(a){
    const s = [a.stage, a.code, a.title];
    if(typeof a.content === 'string') s.push(a.content);
    else if(Array.isArray(a.content)){
      a.content.forEach(c=>{
        if(typeof c === 'string') s.push(c);
        else if(c){
          if(c.title) s.push(c.title);
          if(c.text) s.push(c.text);
          if(c.items) s.push(c.items.join(' '));
          if(c.headers) s.push(c.headers.join(' '));
          if(c.rows) s.push(c.rows.flat().join(' '));
        }
      });
    }
    return s.join(' ');
  }

  // ─── Product tabs ─────────────────
  function renderProductTabs(){
    const html = Object.values(PRODUCTS).map(p=>{
      const recCount = (p.records||[]).length;
      const isEmpty = recCount===0;
      const cls = ['product-tab', state.productId===p.id?'active':'', isEmpty?'disabled':''].filter(Boolean).join(' ');
      const cnt = isEmpty
        ? '<span class="tab-count">未上傳</span>'
        : `<span class="tab-count">${recCount}</span>`;
      return `<button class="${cls}" data-product="${p.id}">${escapeHtml(p.shortName)} ${cnt}</button>`;
    }).join('');
    elProductTabs.innerHTML = html;
    elProductTabs.querySelectorAll('.product-tab').forEach(tab=>{
      tab.addEventListener('click', ()=>{
        const id = tab.dataset.product;
        if(state.productId === id) return;
        switchProduct(id);
      });
    });
  }

  function switchProduct(id){
    state.productId = id;
    state.query = '';
    state.apQuery = '';
    state.stage = 'all';
    state.apStage = 'all';
    state.special = null;
    state.expanded.clear();
    elInput.value = '';
    elApInput.value = '';
    elBox.classList.remove('has-value');
    elApBox.classList.remove('has-value');
    renderProductTabs();
    renderHeader();
    renderViewTabs();
    renderChips();
    renderApChips();
    renderTips();
    renderAll();
  }

  function renderHeader(){
    const p = PRODUCTS[state.productId];
    if(!p) return;
    elBrandVer.textContent = p.version + ' · 彰濱廠';
    elFooterDoc.textContent = '資料來源：' + p.docs.join(' · ');
  }

  // ─── View tabs ─────────────────────
  function renderViewTabs(){
    const p = PRODUCTS[state.productId];
    if(!p) return;
    $('#view-count-records').textContent = (p.records||[]).length;
    $('#view-count-appendices').textContent = (p.appendices||[]).length;
    $$('#view-tabs .view-tab').forEach(t=>{
      t.classList.toggle('active', t.dataset.view===state.view);
    });
  }

  $$('#view-tabs .view-tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      state.view = tab.dataset.view;
      renderViewTabs();
      renderAll();
    });
  });

  // ─── Filter chips ──────────────────
  function renderChips(){
    const p = PRODUCTS[state.productId];
    if(!p){ elChips.innerHTML=''; return; }
    const recs = p.records || [];
    const stages = ['一工段','二工段','三工段'].filter(s=>recs.some(r=>r.stage===s));
    const html = [
      `<button class="chip ${state.stage==='all'?'active':''}" data-stage="all">全部 <span class="count">${recs.length}</span></button>`,
      ...stages.map(s=>{
        const c = recs.filter(r=>r.stage===s).length;
        return `<button class="chip ${state.stage===s?'active':''}" data-stage="${s}">${s} <span class="count">${c}</span></button>`;
      }),
      `<button class="chip ${state.special==='critical'?'active':''}" data-special="critical">★ 關鍵特性</button>`,
      `<button class="chip ${state.special==='special'?'active':''}" data-special="special">☆ 特殊特性</button>`,
    ].join('');
    elChips.innerHTML = html;
    elChips.querySelectorAll('.chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        if(chip.dataset.stage){
          state.stage = chip.dataset.stage;
        }
        if(chip.dataset.special){
          state.special = state.special===chip.dataset.special ? null : chip.dataset.special;
        }
        renderChips();
        renderRecords();
      });
    });
  }

  function renderApChips(){
    const p = PRODUCTS[state.productId];
    if(!p){ elApChips.innerHTML=''; return; }
    const aps = p.appendices || [];
    const stages = ['一工段','二工段','三工段'].filter(s=>aps.some(a=>a.stage===s));
    const html = [
      `<button class="chip ${state.apStage==='all'?'active':''}" data-stage="all">全部 <span class="count">${aps.length}</span></button>`,
      ...stages.map(s=>{
        const c = aps.filter(a=>a.stage===s).length;
        return `<button class="chip ${state.apStage===s?'active':''}" data-stage="${s}">${s} <span class="count">${c}</span></button>`;
      }),
    ].join('');
    elApChips.innerHTML = html;
    elApChips.querySelectorAll('.chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        state.apStage = chip.dataset.stage;
        renderApChips();
        renderAppendices();
      });
    });
  }

  // ─── Tips (記錄頁) ─────────────────
  function renderTips(){
    const p = PRODUCTS[state.productId];
    if(!p) return;
    // 依產品給出不同熱門搜尋詞
    const tipMap = {
      '67ah-long': ['烘箱','化成參數','分檔','A1檔','再生利用','OCV4','DCIR','氦檢','超聲波','極片長度','磁通量'],
      '67ah-std': ['烘箱','化成','分檔','OCV4','DCIR'],
      '50ah': ['烘箱','化成','分檔','OCV4','DCIR'],
    };
    const tips = tipMap[state.productId] || [];
    elTips.innerHTML = '<strong>快速搜尋：</strong>' +
      tips.map(t=>`<code data-q="${escapeHtml(t)}">${escapeHtml(t)}</code>`).join('');
    elTips.querySelectorAll('code').forEach(c=>{
      c.addEventListener('click', ()=>{
        const q = c.dataset.q;
        elInput.value = q;
        state.query = q;
        elBox.classList.add('has-value');
        renderRecords();
        window.scrollTo({top:elList.offsetTop-120,behavior:'smooth'});
      });
    });
  }

  // ─── Filter logic ──────────────────
  function filterRecords(){
    const p = PRODUCTS[state.productId];
    if(!p) return [];
    let arr = p.records || [];
    if(state.stage!=='all') arr = arr.filter(r=>r.stage===state.stage);
    if(state.special==='critical') arr = arr.filter(r=>r.special==='★');
    if(state.special==='special') arr = arr.filter(r=>r.special==='☆');
    if(state.query){
      const tokens = state.query.toLowerCase().split(/\s+/).filter(Boolean);
      arr = arr.filter(r=>{
        const hay = searchableText(r).toLowerCase();
        return tokens.every(t=>hay.includes(t));
      });
    }
    return arr;
  }

  function filterAppendices(){
    const p = PRODUCTS[state.productId];
    if(!p) return [];
    let arr = p.appendices || [];
    if(state.apStage!=='all') arr = arr.filter(a=>a.stage===state.apStage);
    if(state.apQuery){
      const tokens = state.apQuery.toLowerCase().split(/\s+/).filter(Boolean);
      arr = arr.filter(a=>{
        const hay = searchableAppendix(a).toLowerCase();
        return tokens.every(t=>hay.includes(t));
      });
    }
    return arr;
  }

  // ─── Render Records ────────────────
  function renderRecords(){
    const result = filterRecords();
    elHit.textContent = result.length;
    const tags = [];
    if(state.stage!=='all') tags.push(state.stage);
    if(state.special==='critical') tags.push('★ 關鍵特性');
    if(state.special==='special') tags.push('☆ 特殊特性');
    elActive.textContent = tags.length ? '篩選：'+tags.join(' · ') : '';

    if(result.length===0){
      elList.innerHTML='';
      elEmpty.style.display='block';
      return;
    }
    elEmpty.style.display='none';
    const q = state.query;
    const html = result.map(r=>{
      const key = state.productId+'·'+r.stage+'·'+r.process+'·'+r.id+'·'+r.item;
      const isOpen = state.expanded.has(key);
      const badges = [];
      if(r.special==='★') badges.push('<span class="badge critical">關鍵特性</span>');
      if(r.special==='☆') badges.push('<span class="badge special">特殊特性</span>');
      const pill = r.spec ? `<div class="spec-pill mono" title="${escapeHtml(r.spec)}">${escapeHtml(r.spec.length>32?r.spec.slice(0,32)+'…':r.spec)}</div>` : '';
      return `
        <article class="card ${isOpen?'open':''}" data-key="${escapeHtml(key)}">
          <div class="card-head">
            <span class="stage-tag ${stageClass(r.stage)}">${escapeHtml(r.stage)}</span>
            <div class="card-title">
              <h3>${hl(r.item,q)}</h3>
              <div class="card-meta mono">
                <span>${escapeHtml(r.process)}</span>
                <span class="proc">${hl(r.procName,q)}</span>
              </div>
            </div>
            ${pill}
          </div>
          <div class="card-body">
            ${badges.length?`<div class="badges" style="margin-top:10px">${badges.join('')}</div>`:''}
            <div class="field">
              <div class="field-label">產品/製程規格 SPEC</div>
              <div class="field-value spec">${hl(r.spec,q)}</div>
            </div>
            <div class="field">
              <div class="field-label">設備/夾具工裝 EQUIPMENT</div>
              <div class="field-value">${hl(r.equipment,q)}</div>
            </div>
            <div class="field">
              <div class="field-label">評價/測量技術 MEASURE</div>
              <div class="field-value">${hl(r.measure,q)}</div>
            </div>
            <div class="field">
              <div class="field-label">抽樣 SAMPLE</div>
              <div class="field-value">${hl(r.sample,q)}</div>
            </div>
            <div class="field">
              <div class="field-label">管制方法 CONTROL</div>
              <div class="field-value">${hl(r.control,q)}</div>
            </div>
            <div class="field">
              <div class="field-label">反應計劃 ACTION</div>
              <div class="field-value action">${hl(r.action,q)}</div>
            </div>
            <div class="field">
              <div class="field-label">負責人 / 文件 OWNER · DOC</div>
              <div class="field-value mono" style="font-size:13px;color:var(--ink-2)">${escapeHtml(r.owner)} · ${escapeHtml(r.doc)} · ID ${r.id}</div>
            </div>
          </div>
        </article>
      `;
    }).join('');
    elList.innerHTML = html;
  }

  // ─── Render Appendices ─────────────
  function renderAppendices(){
    const result = filterAppendices();
    elApHit.textContent = result.length;
    elApActive.textContent = state.apStage!=='all' ? '篩選：'+state.apStage : '';

    if(result.length===0){
      elApList.innerHTML='';
      elApEmpty.style.display='block';
      return;
    }
    elApEmpty.style.display='none';
    const q = state.apQuery;

    const html = result.map(a => renderAppendixCard(a, q)).join('');
    elApList.innerHTML = html;
  }

  function renderAppendixCard(a, q){
    return `
      <section class="ap-card">
        <div class="ap-head">
          <span class="ap-code mono">${escapeHtml(a.code)}</span>
          <span class="stage-tag ${stageClass(a.stage)}">${escapeHtml(a.stage)}</span>
          <span class="ap-title">${hl(a.title,q)}</span>
        </div>
        <div class="ap-body">
          ${renderAppendixContent(a, q)}
        </div>
      </section>
    `;
  }

  function renderAppendixContent(a, q){
    if(a.type==='paragraph' && Array.isArray(a.content)){
      return `<ul class="ap-list">${a.content.map(s=>`<li>${hl(s,q)}</li>`).join('')}</ul>`;
    }
    if(a.type==='paragraph' && typeof a.content==='string'){
      return `<p class="ap-paragraph">${hl(a.content,q)}</p>`;
    }
    if(a.type==='table' && a.content){
      return renderTable(a.content, q);
    }
    if(a.type==='mixed' && Array.isArray(a.content)){
      return a.content.map(block=>{
        if(typeof block==='string') return `<p class="ap-paragraph">${hl(block,q)}</p>`;
        if(!block) return '';
        if(block.type==='sub') return `<h4 class="ap-sub">${hl(block.title,q)}</h4>`;
        if(block.type==='list') return `<ul class="ap-list">${(block.items||[]).map(s=>`<li>${hl(s,q)}</li>`).join('')}</ul>`;
        if(block.type==='paragraph') return `<p class="ap-paragraph">${hl(block.text,q)}</p>`;
        if(block.type==='note') return `<div class="ap-note">${hl(block.text,q)}</div>`;
        if(block.type==='table') return renderTable(block, q);
        return '';
      }).join('');
    }
    return '';
  }

  function renderTable(t, q){
    const headers = t.headers || [];
    const rows = t.rows || [];
    const note = t.note ? `<div class="ap-note">${hl(t.note,q)}</div>` : '';
    return `
      <div class="ap-table-wrap">
        <table class="ap-table">
          <thead><tr>${headers.map(h=>`<th>${hl(h,q)}</th>`).join('')}</tr></thead>
          <tbody>${rows.map(row=>`<tr>${row.map(cell=>`<td>${hl(cell,q)}</td>`).join('')}</tr>`).join('')}</tbody>
        </table>
      </div>
      ${note}
    `;
  }

  // ─── 主渲染入口 ──────────────────
  function renderAll(){
    const p = PRODUCTS[state.productId];
    if(!p){
      elRecordsControls.style.display='none';
      elApControls.style.display='none';
      elRecordsView.style.display='none';
      elApView.style.display='none';
      elProductEmptyView.style.display='block';
      return;
    }
    const isEmpty = (p.records||[]).length===0 && (p.appendices||[]).length===0;
    if(isEmpty){
      elRecordsControls.style.display='none';
      elApControls.style.display='none';
      elRecordsView.style.display='none';
      elApView.style.display='none';
      elProductEmptyView.style.display='block';
      $('#pe-title').textContent = p.name + ' · 尚未上傳資料';
      $('#pe-desc').textContent = '請上傳對應的管制計畫 PDF 即可在此顯示';
      return;
    }
    elProductEmptyView.style.display='none';
    if(state.view==='records'){
      elRecordsControls.style.display='';
      elApControls.style.display='none';
      elRecordsView.style.display='';
      elApView.style.display='none';
      renderRecords();
    } else {
      elRecordsControls.style.display='none';
      elApControls.style.display='';
      elRecordsView.style.display='none';
      elApView.style.display='';
      renderAppendices();
    }
  }

  // ─── 事件 ──────────────────────────
  let timer = null;
  elInput.addEventListener('input', e=>{
    const v = e.target.value.trim();
    elBox.classList.toggle('has-value', v.length>0);
    clearTimeout(timer);
    timer = setTimeout(()=>{
      state.query = v;
      renderRecords();
    }, 120);
  });
  elClear.addEventListener('click', ()=>{
    elInput.value='';
    state.query='';
    elBox.classList.remove('has-value');
    elInput.focus();
    renderRecords();
  });

  let apTimer = null;
  elApInput.addEventListener('input', e=>{
    const v = e.target.value.trim();
    elApBox.classList.toggle('has-value', v.length>0);
    clearTimeout(apTimer);
    apTimer = setTimeout(()=>{
      state.apQuery = v;
      renderAppendices();
    }, 120);
  });
  elApClear.addEventListener('click', ()=>{
    elApInput.value='';
    state.apQuery='';
    elApBox.classList.remove('has-value');
    elApInput.focus();
    renderAppendices();
  });

  elList.addEventListener('click', e=>{
    const head = e.target.closest('.card-head');
    if(!head) return;
    const card = head.parentElement;
    const key = card.dataset.key;
    if(state.expanded.has(key)){
      state.expanded.delete(key);
      card.classList.remove('open');
    } else {
      state.expanded.add(key);
      card.classList.add('open');
    }
  });

  // "/" 快捷鍵聚焦搜尋
  document.addEventListener('keydown', e=>{
    if(e.key==='/' && document.activeElement!==elInput && document.activeElement!==elApInput){
      e.preventDefault();
      (state.view==='records'?elInput:elApInput).focus();
    }
    if(e.key==='Escape'){
      if(document.activeElement===elInput) elInput.blur();
      if(document.activeElement===elApInput) elApInput.blur();
    }
  });

  // ─── 初始化 ───────────────────────
  // 預設選有資料的第一個產品（67Ah長循環）
  const firstWithData = Object.values(PRODUCTS).find(p=>(p.records||[]).length>0);
  state.productId = firstWithData ? firstWithData.id : Object.keys(PRODUCTS)[0];

  renderProductTabs();
  renderHeader();
  renderViewTabs();
  renderChips();
  renderApChips();
  renderTips();
  renderAll();
})();

</script>

<div id="pwa-banner">
  <div id="pwa-banner-row1">
    <div id="pwa-banner-icon">FA</div>
    <div id="pwa-banner-text">
      <strong>加入主畫面，像 APP 一樣使用</strong>
      <span>離線可用 · 全螢幕 · 一鍵開啟</span>
    </div>
    <button id="pwa-banner-close" aria-label="關閉">×</button>
  </div>
  <div id="pwa-banner-row2">
    <button id="pwa-install-btn">📲 立即安裝</button>

  </div>
  <div id="pwa-ios-guide">
    1. 點下方 Safari「分享」按鈕 <b>⬆</b><br>
    2. 向下捲動，選「<b>加入主畫面</b>」<br>
    3. 右上角點「<b>新增</b>」完成 ✓
  </div>
</div>

<script>
// ── PWA：Service Worker 登記 ─────────────────────────────────────────────────
(function(){
  if(!('serviceWorker' in navigator)) return;

  // 用 Blob 建立 SW，不需要外部 sw.js 檔案
  const swCode = `
const CACHE = 'fatc-v2';
const URLS = [self.location.href.replace('/sw-inline','')];

self.addEventListener('install', e => {
  e.waitUntil(
    caches.open(CACHE).then(c => {
      try { return c.addAll(URLS); } catch(err){ return Promise.resolve(); }
    })
  );
  self.skipWaiting();
});

self.addEventListener('activate', e => {
  e.waitUntil(
    caches.keys().then(keys =>
      Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))
    )
  );
  self.clients.claim();
});

self.addEventListener('fetch', e => {
  if(e.request.method !== 'GET') return;
  e.respondWith(
    fetch(e.request)
      .then(res => {
        const clone = res.clone();
        caches.open(CACHE).then(c => c.put(e.request, clone));
        return res;
      })
      .catch(() => caches.match(e.request))
  );
});
`;

  const blob = new Blob([swCode], {type:'application/javascript'});
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl, {scope: './'})
    .then(reg => console.log('[SW] registered', reg.scope))
    .catch(err => console.warn('[SW] failed:', err));
})();

// ── PWA：安裝橫幅邏輯 ──────────────────────────────────────────────────────
(function(){
  const banner   = document.getElementById('pwa-banner');
  const closeBtn = document.getElementById('pwa-banner-close');
  const installBtn = document.getElementById('pwa-install-btn');
  const iosBtn   = document.getElementById('pwa-ios-btn');
  const iosGuide = document.getElementById('pwa-ios-guide');
  const offlineToast = document.getElementById('offline-toast');

  let deferredPrompt = null;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isInStandalone = window.matchMedia('(display-mode: standalone)').matches
                      || window.navigator.standalone === true;
  const dismissed = sessionStorage.getItem('pwa-banner-dismissed');

  // 離線狀態提示
  function updateOnline() {
    if (!navigator.onLine) {
      offlineToast.classList.add('show');
      setTimeout(() => offlineToast.classList.remove('show'), 4000);
    }
  }
  window.addEventListener('offline', updateOnline);
  window.addEventListener('online', () => offlineToast.classList.remove('show'));

  // 不在 standalone 模式且未關閉過才顯示
  if (isInStandalone || dismissed) return;

  // Android/Chrome：等 beforeinstallprompt
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    setTimeout(() => banner.classList.add('show'), 2000);
  });

  // iOS Safari：直接顯示教學橫幅
  if (isIOS && !isInStandalone) {
    setTimeout(() => {
      banner.classList.add('show');
      iosGuide.classList.add('show');
      installBtn.style.display = 'none';
    }, 2000);
  }

  // 安裝按鈕
  installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const result = await deferredPrompt.userChoice;
    deferredPrompt = null;
    banner.classList.remove('show');
    if (result.outcome === 'accepted') {
      sessionStorage.setItem('pwa-banner-dismissed', '1');
    }
  });

  // iOS 教學切換
  iosBtn.addEventListener('click', () => {
    iosGuide.classList.toggle('show');
  });

  // 關閉
  closeBtn.addEventListener('click', () => {
    banner.classList.remove('show');
    sessionStorage.setItem('pwa-banner-dismissed', '1');
  });
})();
</script>
